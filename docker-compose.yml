version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: leads_finder_redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leads_finder_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL:-your_supabase_url_here}
      - SUPABASE_KEY=${SUPABASE_KEY:-your_supabase_key_here}
    depends_on:
      - redis
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leads_finder_worker
    command: celery -A app.services.scrapers.tasks.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL:-your_supabase_url_here}
      - SUPABASE_KEY=${SUPABASE_KEY:-your_supabase_key_here}
    depends_on:
      - redis
    restart: always

networks:
  default:
    name: leads_finder_network
